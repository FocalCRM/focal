name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Authenticated GitHub API access avoids rate limits when downloading package archives.
  COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  packages:
    name: ${{ matrix.package }} / PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: [core, sales, service, marketing, filament]
        php: ['8.3', '8.5']
        laravel: ['12.*', '13.*']
        dependencies: [lowest, highest]
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Sibling packages are linked through Composer path repositories, which take their
      # version from the current git branch. Pull requests check out a detached commit,
      # so name a local branch to give every package the same version.
      - name: Name the checkout branch
        run: git checkout -B main

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, zip, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Pin Laravel and Testbench
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Show resolved versions
        run: |
          for package in laravel/framework orchestra/testbench pestphp/pest; do
            composer show "$package" --no-interaction | grep -E '^(name|versions)\s+:'
          done

      - name: Run tests
        run: vendor/bin/pest --ci

  postgres:
    name: ${{ matrix.package }} / PostgreSQL 17
    runs-on: ubuntu-latest

    # SQLite tolerates column-alias HAVING clauses, unknown quoted columns, case-insensitive
    # LIKE, and fractions in integer columns; PostgreSQL does not. Run every suite against it.
    strategy:
      fail-fast: false
      matrix:
        package: [core, sales, service, marketing, filament]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: focal
          POSTGRES_PASSWORD: focal
          POSTGRES_DB: focal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U focal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: focal_test
      DB_USERNAME: focal
      DB_PASSWORD: focal

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Name the checkout branch
        run: git checkout -B main

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, mbstring, zip, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --ci

  quality:
    name: Workbench, static analysis, and code style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Name the checkout branch
        run: git checkout -B main

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, mbstring, zip, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate --ansi

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github --memory-limit=2G

      - name: Workbench tests
        run: php artisan test
